  <rect x="552" width="516" height="120" rx="20" class="glass"/><text x="574" y="27" class="mono red" font-size="11">DAILY NEWSLETTER • 2,405 SUBSCRIBERS</text><text x="574" y="61" class="display white" font-size="19" font-weight="700">Java Full Stack Interview Questions for Professionals</text>
</g>
<text x="66" y="545" class="mono blue" font-size="11" font-weight="700">LATEST ARTICLES</text>
