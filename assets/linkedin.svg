</g>
<g transform="translate(656 214)">
  <rect width="478" height="126" rx="22" class="glass"/><text x="24" y="30" class="mono cyan" font-size="11">READ ALL ON LINKEDIN</text><text x="24" y="71" class="display white" font-size="27" font-weight="700">linkedin.com/in/deepakkumarkesharwani</text><text x="420" y="76" class="display cyan arrow" font-size="34">→</text>
</g>
<g transform="translate(66 370)">
